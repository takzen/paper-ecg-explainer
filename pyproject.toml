[project]
name = "paper-ecg-explainer"
version = "0.2.0"
description = "Educational project: turns a scanned paper ECG into an interactive, plain-language explanation of the heart rhythm. NOT a medical device."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Krzysztof Pika" }]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pillow>=10.4",
    "scipy>=1.13",
]
